[project]
name = "van-dao-truong-sinh-backend"
version = "0.1.0"
description = "FastAPI backend for Van Dao Truong Sinh Idle."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.53",
  "uvicorn[standard]==0.53.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
